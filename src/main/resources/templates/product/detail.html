<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Product Detail</title></head>
<body>
<h1>Product Detail</h1>
<p><a th:href="@{/products}">Back to Product List</a></p>
<img th:if="${product.imageName != null}" th:src="@{/uploads/{fileName}(fileName=${product.imageName})}" alt="Product Image" width="300">
<h2 th:text="${product.name}">Product Name</h2>
<p>Price: <span th:text="${product.price}"></span></p>
<p>Stock: <span th:text="${product.stock}"></span></p>
</body>
</html>
